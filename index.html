<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIT Co-op Offer & Relocation True-Net Comparator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div>
      <h1>RIT Co-op Offer &amp; Relocation True-Net Comparator</h1>
      <p class="subtitle">Compare up to 3 co-op offers after federal/state/FICA taxes, short-term housing, and transit costs.</p>
    </div>
    <div class="toolbar">
      <button type="button" id="resetBtn">Reset Defaults</button>
      <button type="button" class="primary" id="copyBtn">Copy Comparison Summary</button>
    </div>
  </header>

  <div class="summary-banner" id="summaryBanner">
    Loading comparison insights...
  </div>

  <main class="offers-grid" id="offersGrid"></main>

  <footer>
    Built for MGIS 130 (RIT) &bull; Client-side estimation tool only (no personal data stored externally or transmitted).
  </footer>

  <script src="presets.js"></script>
  <script src="calculator.js"></script>
  <script src="app.js"></script>
</body>
</html>
