  <script>
    // Annualized progressive 2026 single-filer federal tax estimation (with standard deduction)
    function estimateFederalTax(termGross, weeks) {
      const annualized = (termGross / weeks) * 52;
      const standardDeduction = 15000;
      const taxable = Math.max(0, annualized - standardDeduction);

      let annualTax = 0;
      const brackets = [
        { limit: 11925, rate: 0.10 },
        { limit: 48475, rate: 0.12 },
        { limit: 103350, rate: 0.22 },
        { limit: Infinity, rate: 0.24 }
      ];

      let prev = 0;
      for (const b of brackets) {
        if (taxable > prev) {
          annualTax += (Math.min(taxable, b.limit) - prev) * b.rate;
          prev = b.limit;
        }
      }
      return (annualTax / 52) * weeks;
    }
